services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: company_os
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  api:
    build: ../apps/api
    env_file: ../.env
    ports: ['8000:8000']
    depends_on: [postgres, redis]
  worker:
    build: ../apps/api
    env_file: ../.env
    command: celery -A app.queues.celery_app.celery_app worker --loglevel=INFO
    depends_on: [postgres, redis]
volumes:
  pgdata:
